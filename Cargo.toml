[package]
name = "sinif-sozlesmesi"
version = "0.1.0"
edition = "2021"
description = "Ercan'ın araç ekosistemi (zopay, zopay-word, agent-reach-rs, pasli-beyin, el-Fihrist) için paylaşılan veri sınıfı şemaları, değişiklik günlüğü biçimi ve dal kimliği — bkz. el-Fihrist docs/adr/0001"
license = "MIT"
repository = "https://github.com/Ercaner1988/sinif-sozlesmesi"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
